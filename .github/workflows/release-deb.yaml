---
name: Release Debian package

on:
  workflow_call:
    inputs:
      path:
        description: Directory containing debian/, relative to the repository root
        required: false
        default: .
        type: string
      suite:
        description: Ubuntu series; selects the builder image
        required: false
        default: stonking
        type: string
      registry:
        description: Where build-deb published the package artifact
        required: false
        default: ghcr.io/unity-desktop/oci-packages
        type: string
      vendor:
        description: DEP-14 vendor prefix of the git tag
        required: false
        default: ubuntu
        type: string
      latest:
        description: Mark the release as the repository's latest
        required: false
        default: true
        type: boolean
      prerelease:
        description: Mark the release as a pre-release
        required: false
        default: false
        type: boolean
      draft:
        description: Create the release as a draft
        required: false
        default: false
        type: boolean

    outputs:
      tag:
        description: The git tag of the release
        value: ${{ jobs.release.outputs.tag }}
      release-url:
        description: URL of the GitHub release
        value: ${{ jobs.release.outputs.release-url }}

jobs:
  release:
    name: ${{ inputs.path }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/unity-desktop/builder:${{ inputs.suite }}

    outputs:
      tag: ${{ steps.describe.outputs.tag }}
      release-url: ${{ steps.release.outputs.url }}

    defaults:
      run:
        shell: bash -euo pipefail {0}

    steps:
      - uses: actions/checkout@v7

      # DEP-14 tag: git refs cannot hold ':' or '~', so they become '%' and '_'.
      - name: Describe the release
        id: describe
        working-directory: ${{ inputs.path }}
        env:
          VENDOR: ${{ inputs.vendor }}
        run: |
          source=$(dpkg-parsechangelog -S Source)
          version=$(dpkg-parsechangelog -S Version)
          {
            echo "source=$source"
            echo "version=$version"
            echo "tag=$VENDOR/$source/$(echo "$version" | tr ':~' '%_')"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | oras login ghcr.io --username "$ACTOR" --password-stdin

      - name: Pull the build
        id: pull
        env:
          ARTIFACT: ${{ inputs.registry }}/${{ steps.describe.outputs.source }}:sha-${{ github.sha }}
        run: |
          oras pull "$ARTIFACT" --output "$RUNNER_TEMP/assets"
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "digest=$(oras resolve "$ARTIFACT")" >> "$GITHUB_OUTPUT"

      # Changelog entry, one line per binary package, and the artifact it came from.
      - name: Write the release notes
        working-directory: ${{ inputs.path }}
        env:
          SOURCE: ${{ steps.describe.outputs.source }}
          VERSION: ${{ steps.describe.outputs.version }}
          ARTIFACT: ${{ steps.pull.outputs.artifact }}
          DIGEST: ${{ steps.pull.outputs.digest }}
        run: |
          {
            echo "## $SOURCE $VERSION"
            echo
            dpkg-parsechangelog -S Changes | grep '^  ' | sed 's/^ //'
            echo
            echo "### Binary packages"
            echo
            for deb in "$RUNNER_TEMP"/assets/*.deb; do
              echo "- \`$(dpkg-deb -f "$deb" Package)\` – $(dpkg-deb -f "$deb" Description | head -1)"
            done
            echo
            echo "### OCI artifact"
            echo
            echo "\`$ARTIFACT\`, digest \`$DIGEST\`"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create the release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.describe.outputs.tag }}
          name: ${{ steps.describe.outputs.source }} ${{ steps.describe.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/notes.md
          files: ${{ runner.temp }}/assets/*
          fail_on_unmatched_files: true
          make_latest: ${{ inputs.latest }}
          prerelease: ${{ inputs.prerelease }}
          draft: ${{ inputs.draft }}
